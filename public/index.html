<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08070c">
<meta name="description" content="Insert Coin — une petite salle d'arcade en ligne. Des jeux faits maison, jouables tout de suite dans le navigateur.">
<meta property="og:title" content="Insert Coin">
<meta property="og:description" content="Une petite salle d'arcade en ligne. Des jeux faits maison, jouables tout de suite.">
<meta property="og:type" content="website">
<title>Insert Coin — salle d'arcade</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Insert Coin">
<meta property="og:image" content="/icons/icon-512.png">
<link rel="stylesheet" href="/css/hub.css">
<script src="/maj.js" defer></script>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="bg-glow glow-a"></div>
  <div class="bg-glow glow-b"></div>
  <div class="bg-grid"></div>
  <div class="bg-scan"></div>
  <div class="bg-vig"></div>
</div>

<header class="hero">
  <div class="wrap">
    <div class="kicker">salle d'arcade · maison</div>
    <h1 class="logo">
      <span class="l1">Insert</span>
      <span class="l2">Coin</span>
    </h1>
    <p class="tagline">
      Des jeux faits maison, jouables tout de suite dans le navigateur.
      Rien à créer comme compte — et ça s’installe comme une appli.
    </p>
    <div class="installer" id="installer" hidden>
      <button class="installer-btn" id="b-installer">📲 Installer l’application</button>
      <div class="installer-aide" id="installer-aide" hidden></div>
    </div>
    <div class="coin">▸ Choisissez votre machine</div>
  </div>
</header>

<main class="wrap">
  <div class="section-head">
    <h2>Machines disponibles</h2>
    <i></i>
    <b id="count">—</b>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer class="wrap">
  <div class="foot">
    <span>Insert Coin — arcade personnelle</span>
    <span><a href="https://github.com/Rubarbe-gcc/Liar-s-saloon-" rel="noopener">Code source</a></span>
  </div>
</footer>

<script type="module">
/**
 * Catalogue du hub.
 *
 * Ajouter un jeu = ajouter une entree ici et deposer ses fichiers dans
 * `public/games/<slug>/`. Rien d'autre a toucher.
 */
const GAMES = [
  {
    slug: 'brasier',
    title: 'BRASIER',
    desc: "Huit champions, une taverne-forge. Recrutez des serviteurs, fusionnez-les en dores, et soyez le dernier debout. En ligne uniquement : les chaises vides sont prises par des bots.",
    icon: '🔥',
    tags: ['En ligne', 'Taverne & triples', '8 joueurs'],
    art: 'linear-gradient(140deg,#ffb030,#ff5a12 40%,#5a1a06 75%,#0d0806)',
    tint: 'rgba(255,106,26,.32)',
    badge: 'nouveau',
    ready: true,
  },
  {
    slug: 'raid',
    title: 'RAID',
    desc: "Jeu de role solo au tour par tour. Partez avec un seul heros, choisissez votre chemin sur la carte, trouvez des compagnons et de l'equipement, et traversez dix chapitres jusqu'au dernier roi.",
    icon: '\u2694',
    tags: ['Solo', 'Jeu de role', '10 chapitres'],
    art: 'linear-gradient(140deg,#e8c060,#8a5a1c 45%,#3b2a14 78%,#0c0a07)',
    tint: 'rgba(232,192,96,.3)',
    ready: true,
  },
  {
    slug: 'echo',
    title: 'ÉCHO',
    desc: "Jeu de fete a la voix. On entend un son, on l'imite au micro en suivant sa ligne en direct, et la roue distribue points et sabotages. Avec sa tete en photo sur son bonhomme.",
    icon: '🎤',
    tags: ['Voix', 'Solo, soiree & en ligne', '1-8 joueurs'],
    art: 'linear-gradient(140deg,#f472b6,#ffd84d 55%,#0a0512)',
    tint: 'rgba(244,114,182,.32)',
    ready: true,
  },
  {
    slug: 'zenith',
    title: 'ZÉNITH',
    desc: "Combat au tour par tour. Trente combattants, equipes de trois, roles et elements qui se dominent. Solo ou en ligne.",
    icon: '⚡',
    tags: ['Tour par tour', 'Solo & en ligne', '30 combattants'],
    art: 'linear-gradient(140deg,#7c5cff,#ff3d68 55%,#070310)',
    tint: 'rgba(124,92,255,.32)',
    ready: true,
  },
  {
    slug: 'liars-saloon',
    title: "Liar's Saloon",
    desc: "Bluff, accusations et roulette russe autour d'un tapis vert. Seul contre la machine, ou entre amis avec un code de table.",
    icon: '🎴',
    tags: ['Bluff', 'Solo & en ligne', '2–4 joueurs'],
    art: 'linear-gradient(140deg,#6d3d24,#1d4436 52%,#0c0705)',
    tint: 'rgba(232,183,92,.26)',
    ready: true,
  },
];

/** Emplacements vides, pour donner sa forme a la galerie. */
const SOON = 1;

const grid = document.getElementById('grid');
const frag = document.createDocumentFragment();

for (const g of GAMES) {
  const a = document.createElement('a');
  a.className = 'game';
  a.href = `/games/${g.slug}/`;
  a.style.setProperty('--tint', g.tint || 'rgba(255,77,141,.22)');

  a.innerHTML =
    (g.badge ? `<span class="ribbon is-new">${esc(g.badge)}</span>` : '') +
    `<div class="game-art" style="--art:${g.art}"><span>${g.icon}</span></div>` +
    `<div class="game-body">` +
      `<h3 class="game-title">${esc(g.title)}</h3>` +
      `<p class="game-desc">${esc(g.desc)}</p>` +
      `<div class="game-meta">${
        g.tags.map((t, i) => `<span class="tag${i === 0 ? ' is-hot' : ''}">${esc(t)}</span>`).join('')
      }</div>` +
    `</div>`;
  frag.appendChild(a);
}

for (let i = 0; i < SOON; i++) {
  const d = document.createElement('div');
  d.className = 'game is-soon';
  d.innerHTML =
    '<div class="game-art"><span>🕹️</span></div>' +
    '<div class="game-body">' +
      '<h3 class="game-title">Emplacement libre</h3>' +
      '<p class="game-desc">La prochaine machine arrive bientôt.</p>' +
    '</div>';
  frag.appendChild(d);
}

grid.appendChild(frag);
document.getElementById('count').textContent =
  `${GAMES.length} jeu${GAMES.length > 1 ? 'x' : ''}`;

function esc(s) {
  return String(s).replace(/[&<>"']/g, (c) =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* Installer l'application.
   Sur Android et sur ordinateur, le navigateur nous confie sa fenêtre
   d'installation : le bouton l'ouvre directement. Ailleurs (iPhone,
   navigateurs intégrés aux applis), il n'existe aucun moyen de la déclencher :
   le bouton explique alors le geste à faire, selon l'appareil. */
(() => {
  const zone = document.getElementById('installer');
  const bouton = document.getElementById('b-installer');
  const aide = document.getElementById('installer-aide');
  const installee = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  if (installee) return;          // on est déjà dans l'application
  zone.hidden = false;

  let invite = null;
  addEventListener('beforeinstallprompt', (e) => { e.preventDefault(); invite = e; aide.hidden = true; });
  addEventListener('appinstalled', () => {
    invite = null;
    bouton.hidden = true;
    aide.hidden = false;
    aide.innerHTML = '✅ <b>Application installée.</b> Retrouvez l’icône « Insert Coin » sur votre écran d’accueil.';
  });

  const ua = navigator.userAgent;
  const iOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const integre = /FBAN|FBAV|Instagram|Snapchat|TikTok|Line\/|WhatsApp|; wv\)|GSA\//.test(ua);
  const safari = iOS && /Safari/.test(ua) && !/CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  const android = /Android/.test(ua);

  function expliquer() {
    let html;
    if (integre) {
      html = '<b>Cette page est ouverte dans une autre appli</b> (scanner, réseau social…), qui ne sait pas installer.'
        + '<ol><li>Touchez le menu <b>⋮</b> ou <b>⋯</b> de cette fenêtre.</li>'
        + `<li>Choisissez <b>« Ouvrir dans ${iOS ? 'Safari' : 'Chrome'} »</b>.</li>`
        + '<li>Revenez toucher ce bouton.</li></ol>';
    } else if (iOS && !safari) {
      html = '<b>Sur iPhone, l’installation se fait depuis Safari.</b>'
        + '<ol><li>Ouvrez cette page dans <b>Safari</b>.</li>'
        + '<li>Touchez le bouton <b>Partager</b> (le carré avec une flèche vers le haut).</li>'
        + '<li>Choisissez <b>« Sur l’écran d’accueil »</b>, puis <b>Ajouter</b>.</li></ol>';
    } else if (iOS) {
      html = '<ol><li>Touchez le bouton <b>Partager</b> en bas de l’écran (le carré avec une flèche vers le haut).</li>'
        + '<li>Faites défiler et choisissez <b>« Sur l’écran d’accueil »</b>.</li>'
        + '<li>Touchez <b>Ajouter</b>. L’icône « Insert Coin » apparaît sur l’écran d’accueil.</li></ol>';
    } else if (android) {
      html = '<ol><li>Touchez le menu <b>⋮</b> en haut à droite du navigateur.</li>'
        + '<li>Choisissez <b>« Installer l’application »</b> (ou <b>« Ajouter à l’écran d’accueil »</b>).</li>'
        + '<li>Validez. L’icône « Insert Coin » apparaît sur l’écran d’accueil.</li></ol>'
        + 'Si vous ne voyez pas cette ligne, ouvrez la page dans <b>Chrome</b>.';
    } else {
      html = '<ol><li>Dans la barre d’adresse, cliquez sur l’icône <b>d’installation</b> (un écran avec une flèche), à droite.</li>'
        + '<li>Ou ouvrez le menu <b>⋮</b> du navigateur, puis <b>« Installer Insert Coin »</b>.</li></ol>'
        + 'L’installation fonctionne avec Chrome et Edge.';
    }
    aide.innerHTML = html;
    aide.hidden = false;
  }

  bouton.addEventListener('click', async () => {
    if (!invite) { expliquer(); return; }
    invite.prompt();
    try { await invite.userChoice; } catch { /* fenêtre fermée */ }
    invite = null;
  });
})();

/* Service worker : rend le site installable et jouable sans réseau.
   Un échec ici ne doit jamais empêcher de jouer. */
if ('serviceWorker' in navigator) {
  addEventListener('load', () => {
    navigator.serviceWorker.register('/sw.js', { scope: '/' })
      .catch((err) => console.warn('[pwa] service worker non enregistré :', err));
  });
}
</script>
</body>
</html>
